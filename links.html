<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --purple:#7C3AED;--cyan:#06B6D4;
  --bg:#0F172A;--card:#111827;
}
body{
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cairo',sans-serif;
  overflow:hidden;
  position:relative;
}

/* BG */
.bg-glow{position:fixed;inset:0;pointer-events:none}
.bg-glow::before{
  content:'';position:absolute;
  top:-20%;left:50%;transform:translateX(-50%);
  width:80%;height:60%;
  background:radial-gradient(ellipse,rgba(124,58,237,0.2) 0%,transparent 65%);
}
.bg-glow::after{
  content:'';position:absolute;
  bottom:-20%;left:50%;transform:translateX(-50%);
  width:60%;height:50%;
  background:radial-gradient(ellipse,rgba(6,182,212,0.1) 0%,transparent 65%);
}
.bg-grid{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(124,58,237,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,58,237,0.04) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

/* CARD */
.card{
  position:relative;z-index:2;
  width:100%;max-width:400px;
  padding:2.5rem 1.5rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.2rem;
  animation:fadeUp 0.8s ease both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* AVATAR */
.avatar{
  width:90px;height:90px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:2.2rem;
  letter-spacing:0.1em;
  color:white;
  box-shadow:0 0 0 3px rgba(124,58,237,0.3),0 0 30px rgba(124,58,237,0.3);
  animation:fadeUp 0.8s 0.1s ease both;
}

.name{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.2rem;
  letter-spacing:0.15em;
  background:linear-gradient(135deg,#fff,rgba(255,255,255,0.8));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:fadeUp 0.8s 0.2s ease both;
}

.title{
  font-size:0.85rem;
  color:rgba(255,255,255,0.45);
  letter-spacing:0.06em;
  text-align:center;
  line-height:1.6;
  animation:fadeUp 0.8s 0.3s ease both;
}
.title span{color:var(--cyan);font-weight:600}

.divider{
  width:40px;height:2px;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  border-radius:2px;
  animation:fadeUp 0.8s 0.35s ease both;
}

/* LINKS */
.links{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:0.9rem;
  margin-top:0.5rem;
}

.link-btn{
  width:100%;
  background:rgba(17,24,39,0.8);
  border:1px solid rgba(124,58,237,0.2);
  border-radius:14px;
  padding:1rem 1.4rem;
  display:flex;
  align-items:center;
  gap:1rem;
  text-decoration:none;
  color:white;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px);
  animation:fadeUp 0.8s ease both;
}
.link-btn::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(6,182,212,0.05));
  opacity:0;
  transition:opacity 0.3s;
}
.link-btn:hover{
  border-color:rgba(124,58,237,0.6);
  transform:translateY(-3px) scale(1.01);
  box-shadow:0 15px 40px rgba(124,58,237,0.2);
}
.link-btn:hover::before{opacity:1}

.link-btn:nth-child(1){animation-delay:0.4s}
.link-btn:nth-child(2){animation-delay:0.5s}
.link-btn:nth-child(3){animation-delay:0.6s}
.link-btn:nth-child(4){animation-delay:0.7s}

.link-icon{
  width:42px;height:42px;min-width:42px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;
  flex-shrink:0;
}

.link-icon.website{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(6,182,212,0.3))}
.link-icon.whatsapp{background:rgba(37,211,102,0.15)}
.link-icon.linkedin{background:rgba(10,102,194,0.2)}
.link-icon.email{background:rgba(234,88,12,0.15)}

.link-text{flex:1;text-align:right}
.link-title{font-size:0.95rem;font-weight:700;color:white}
.link-sub{font-size:0.78rem;color:rgba(255,255,255,0.4);margin-top:0.1rem}

.link-arrow{
  color:rgba(255,255,255,0.2);
  font-size:1rem;
  transition:all 0.3s;
  flex-shrink:0;
}
.link-btn:hover .link-arrow{
  color:var(--cyan);
  transform:translateX(-4px);
}

/* FOOTER */
.footer{
  font-size:0.75rem;
  color:rgba(255,255,255,0.2);
  letter-spacing:0.05em;
  margin-top:0.5rem;
  animation:fadeUp 0.8s 0.8s ease both;
}
.footer span{

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
</style>
